<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Integrity Analyst</title>
  <meta name="description" content="Ask questions over the payment-integrity mart, review SIU approvals, navigate policy, and run evals.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <script>
    try { const t = localStorage.getItem("pia-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 13l4 4 10-11" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="brand-title">Payment Integrity Analyst</div>
        <div class="brand-sub">Text-to-SQL · PHI guard · SIU approvals · Policy navigation</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="pill pill-provider" id="provider" title="Model behind the agent">…</span>
      <div class="segmented" role="radiogroup" aria-label="Acting role" id="roleSwitch">
        <button role="radio" data-role="analyst" aria-checked="true">Analyst</button>
        <button role="radio" data-role="siu_lead" aria-checked="false">SIU lead</button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle colour theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <a href="#/ask" data-view="ask">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H8l-4 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Ask</span>
      </a>
      <a href="#/approvals" data-view="approvals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Approvals</span><b class="badge" id="queueBadge" hidden>0</b>
      </a>
      <a href="#/policy" data-view="policy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z M15 3v4h4 M9 11h7 M9 15h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Policy</span>
      </a>
      <a href="#/evals" data-view="evals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Evals</span>
      </a>
      <a href="#/schema" data-view="schema">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6 M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Schema</span>
      </a>
    </nav>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
