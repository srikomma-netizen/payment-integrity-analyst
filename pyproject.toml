[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-integrity-analyst"
version = "0.1.0"
description = "Plain-English questions over healthcare claims data, answered with guarded SQL."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["analyst*", "docnav*"]

[tool.setuptools.package-data]
analyst = ["evals/*.json"]
docnav = ["data/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
